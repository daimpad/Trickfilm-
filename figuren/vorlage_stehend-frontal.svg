  <g id="hilfe-legende" inkscape:groupmode="layer" inkscape:label="hilfe-legende"><text x="16" y="24" font-family="Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#000000">Zeichenvorlage stehend-frontal · Rig-Spezifikation Fassung 1</text><text x="16" y="42" font-family="Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#000000">Je Teil eine Ebene mit genau diesem Namen; Hilfsebenen (hilfe-…) werden beim Import ignoriert.</text><text x="16" y="58" font-family="Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#000000">Blaue Kreise: Drehpunkte mit Überlappungskreis 14 px; das Teil muss den Kreis decken.</text><text x="16" y="74" font-family="Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#000000">Konturen 4 oder 6 px · keine Transformationen, Verläufe, Filter, Masken, Schatten · Handvarianten offen, greifend, zeigend.</text><rect x="16" y="82" width="12" height="12" fill="#ff00ff"/><text x="32" y="92" font-family="Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#000000">#ff00ff Kleidung 1</text><rect x="136" y="82" width="12" height="12" fill="#ffff00" stroke="#000000" stroke-width="1"/><text x="152" y="92" font-family="Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#000000">#ffff00 Kleidung 2</text><rect x="256" y="82" width="12" height="12" fill="#00ff00"/><text x="272" y="92" font-family="Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#000000">#00ff00 Zubehör</text></g>

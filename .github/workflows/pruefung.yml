# Prüflauf bei jedem Push und Pull Request (Abschnitt 13.3 der Werkstatt).
# Cue-Listen vergleichen kommt mit Phase 4 hinzu.
name: Prüfung

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruefung:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund

      - name: Chromium für Standbilder und Seitentests
        run: npx playwright install --with-deps chromium

      - name: Fassungen von remotion und @remotion/* gleich und exakt
        run: |
          node -e '
            const p = require("./package.json");
            const alle = { ...p.dependencies, ...p.devDependencies };
            const r = Object.entries(alle).filter(([n]) => n === "remotion" || n.startsWith("@remotion/"));
            const lose = Object.entries(alle).filter(([, v]) => !/^\d+\.\d+\.\d+$/.test(v));
            if (lose.length) { console.error("FEHLER nicht exakt gepinnt:", lose); process.exit(1); }
            if (new Set(r.map(([, v]) => v)).size !== 1) { console.error("FEHLER Remotion-Fassungen ungleich:", r); process.exit(1); }
            console.log("Remotion", r[0][1], "in", r.length, "Paketen; alle Fassungen exakt.");
          '

      - name: Typen
        run: npm run typecheck

      - name: Bibliothekstests
        run: npm test

      - name: Geheimnisse und Verbotenes
        run: npm run verboten

      - name: Jede Szene bauen (Brief gegen Code, keine NaN, Reichweiten)
        run: npm run szene:bauen -- alle

      - name: Erzeugte Dateien aktuell (Spezifikation, Vorlagen, Teilesätze mit Gelenkprüfung, Protokolle)
        run: npm run erzeugt:pruefen

      - name: Webseite baut (Befehle beschrieben, Links vorhanden)
        run: node tools/seite-bauen.js

# Prüflauf bei jedem Pull Request und jedem Push auf main (Abschnitt 13.3 der Werkstatt).
name: Prüfung

# Push nur auf main; ein Pull Request prüft seinen Zweig selbst, so läuft ein Commit nicht zweimal.
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  pruefung:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund

      - name: Paketquelle mit Wiederholung statt des langsamen Azure-Spiegels
        # Der Spiegel azure.archive.ubuntu.com hing am 2026-10-22 dreimal beim Laden der Pakete, bis die Zeitgrenze griff.
        # Der Runner liest seine Spiegel aus apt-mirrors.txt (mirror+file:); dort steht jetzt nur archive.ubuntu.com.
        run: |
          echo "https://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/80-wiederholen > /dev/null

      - name: ffmpeg für Messung und Bearbeitung der Geräusche
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Chromium für Standbilder und Seitentests
        # Ohne --with-deps: die Bibliotheken liegen auf dem Runner, --with-deps lud nur 21 MB Schriften nach.
        run: npx playwright install chromium

      - name: Fassungen von remotion und @remotion/* gleich und exakt
        run: |
          node -e '
            const p = require("./package.json");
            const alle = { ...p.dependencies, ...p.devDependencies };
            const r = Object.entries(alle).filter(([n]) => n === "remotion" || n.startsWith("@remotion/"));
            const lose = Object.entries(alle).filter(([, v]) => !/^\d+\.\d+\.\d+$/.test(v));
            if (lose.length) { console.error("FEHLER nicht exakt gepinnt:", lose); process.exit(1); }
            if (new Set(r.map(([, v]) => v)).size !== 1) { console.error("FEHLER Remotion-Fassungen ungleich:", r); process.exit(1); }
            console.log("Remotion", r[0][1], "in", r.length, "Paketen; alle Fassungen exakt.");
          '

      - name: Typen
        run: npm run typecheck

      - name: Bibliothekstests
        run: npm test

      - name: Geheimnisse und Verbotenes
        run: npm run verboten

      - name: Jede Szene bauen (Brief gegen Code, keine NaN, Reichweiten)
        run: npm run szene:bauen -- alle

      - name: Erzeugte Dateien aktuell (Spezifikation, Vorlagen, Teilesätze mit Gelenkprüfung, Cue-Listen, Protokolle)
        run: npm run erzeugt:pruefen

      - name: Webseite baut (Befehle beschrieben, Links vorhanden)
        run: node tools/seite-bauen.js

# Webseite der Werkstatt auf GitHub Pages: bei jedem Push auf main aus dem Repository neu gebaut
# (tools/seite-bauen.js) und nur das Ergebnis out/seite/ veröffentlicht. Von Hand über den Reiter Actions startbar.
name: Seite auf Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur eine Veröffentlichung zugleich; eine laufende wird nicht abgebrochen.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund

      - name: Chromium für Prototyp, Standbilder und Kontaktbogen
        run: npx playwright install --with-deps chromium

      - name: Seite bauen
        run: node tools/seite-bauen.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/seite

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

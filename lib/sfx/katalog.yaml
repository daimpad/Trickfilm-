# Katalog aller Geräusche und Laute (Abschnitt 8.2). IDs und Kommentare deutsch, Prompts englisch.
# Klangcharakter: dezent, lustig, nicht absurd; leicht überzeichnete echte Geräusche.
# Felder:
#   art: sfx (Geräusch, eleven_text_to_sound_v2) oder laut (kurzer Laut ohne Wort, eleven_v3)
#   prompt / text: Generierung; text mit Audio-Tag in eckigen Klammern
#   dauer_s: Ziellänge; varianten_vorrat: freigegebene Einzelereignisse je Cue, Auswahl je Ereignis deterministisch
#   gain_db: Grundpegel im Mix; ereignisse: welche Bewegungsereignisse diesen Cue tragen dürfen
#   einzel: true, wenn eine Datei genau einen Anschlag trägt (gekürzt vor dem zweiten Einsatz)
#   nachklang: true, wenn der Klang ausklingen darf (nie im Klang gekürzt)
#   loop: true, wenn der Klang als Schleife unter einem Vorgang liegt


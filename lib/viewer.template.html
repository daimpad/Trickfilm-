<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITEL}}</title>
<style>
/* Prototyp-Seite: Bühne, Abspielen, Regler, Sprungmarken, Geräusche. Keine Übergänge, keine Animationen. */
:root { {{TOKENS_CSS}} }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--grund); color: var(--text); font-family: var(--schrift); }
h1 { font-size: 24px; margin: 0 0 8px; }
#buehne { width: 100%; max-width: 1920px; border: 4px solid var(--kontur); background: var(--weiss); }
#buehne svg { display: block; width: 100%; height: auto; }
#steuerung { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 8px 0; font-size: 18px; }
#steuerung button { font: inherit; padding: 4px 16px; border: 4px solid var(--kontur); background: var(--weiss); color: var(--text); cursor: pointer; }
#steuerung button[aria-pressed="true"] { background: var(--text); color: var(--weiss); }
#regler { flex: 1 1 320px; }
#marken { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
#marken button { font: inherit; font-size: 16px; padding: 2px 8px; border: 2px solid var(--kontur); background: var(--weiss); color: var(--text); cursor: pointer; }
#hinweis { font-size: 18px; margin: 8px 0; min-height: 24px; }
#beschreibung { font-size: 16px; max-width: 960px; }
.leise { opacity: 0.8; }
</style>
</head>
<body>
<h1>{{TITEL}}</h1>
<div id="buehne">{{SVG}}</div>
<div id="steuerung">
  <button id="abspielen" type="button" aria-pressed="false">Abspielen</button>
  <input id="regler" type="range" min="0" max="0" step="1" value="0" aria-label="Bild">
  <span id="zeit" aria-live="off">t = 0.00 s</span>
  <label><input id="schleife" type="checkbox"> Schleife</label>
  <label><input id="geraeusche" type="checkbox" checked> Geräusche</label>
  <span id="tonstatus" class="leise"></span>
</div>
<div id="marken" aria-label="Sprungmarken"></div>
<p id="hinweis" role="status"></p>
<p id="beschreibung">{{DESC}}</p>
<p class="leise">Leertaste: Abspielen/Pause · ←/→: ein Bild · Pos1: Anfang</p>
{{IMPORTMAP}}
<script type="application/json" id="cues">{{CUES_JSON}}</script>
<script type="module">
import * as A from '{{SZENE_ANIMATION}}';
import * as S from '{{SZENE_SCENE}}';

const fps = A.SPEC.fps;
const letzterFrame = Math.round(A.SPEC.duration * fps);
const svg = document.querySelector('#buehne svg');
const index = new Map([...svg.querySelectorAll('[id]')].map((el) => [el.id, el]));
const $ = (id) => document.getElementById(id);
const regler = $('regler');
regler.max = String(letzterFrame);

let frame = 0;
let spielt = false;
let startZeit = 0;
let startFrame = 0;

// Geräusche: Cues mit Startzeit und eingebetteten OGG-Daten; ein Cue klingt, wenn die Wiedergabe
// über seinen Start läuft. Springen und Ziehen lösen nichts aus.
const cues = JSON.parse($('cues').textContent);
const ctx = 'AudioContext' in window ? new AudioContext() : null;
const puffer = new Map();
async function ladeTon() {
  if (!ctx) return;
  for (const c of cues) {
    if (!c.daten || puffer.has(c.datei)) continue;
    const bytes = Uint8Array.from(atob(c.daten), (z) => z.charCodeAt(0));
    puffer.set(c.datei, await ctx.decodeAudioData(bytes.buffer));
  }
}
function klinge(vonFrame, bisFrame) {
  if (!ctx || !$('geraeusche').checked) return;
  for (const c of cues) {
    const f = Math.round(c.start * fps);
    if (f > vonFrame && f <= bisFrame && puffer.has(c.datei)) {
      const quelle = ctx.createBufferSource();
      quelle.buffer = puffer.get(c.datei);
      const g = ctx.createGain();
      g.gain.value = Math.pow(10, (c.gain_db ?? 0) / 20);
      quelle.connect(g).connect(ctx.destination);
      quelle.start();
    }
  }
}
$('tonstatus').textContent = cues.length ? `${cues.length} Cues` : 'keine Cues';

/** Bild f zeigen: computeState(f / fps), dann die Liste der Attribute schreiben. */
function zeige(f) {
  frame = Math.max(0, Math.min(letzterFrame, Math.round(f)));
  const s = A.computeState(frame / fps);
  for (const [id, attr, wert] of S.sceneApply(s)) index.get(id)?.setAttribute(attr, String(wert));
  regler.value = String(frame);
  $('zeit').textContent = `t = ${(frame / fps).toFixed(2)} s · Bild ${frame}/${letzterFrame}`;
}

// Zeitgeber ist performance.now(); requestAnimationFrame stößt nur das Zeichnen an.
function takt(jetzt) {
  if (!spielt) return;
  const vorher = frame;
  const f = startFrame + ((jetzt - startZeit) / 1000) * fps;
  if (f >= letzterFrame) {
    zeige(letzterFrame);
    klinge(vorher, letzterFrame);
    if ($('schleife').checked) {
      startFrame = 0;
      startZeit = jetzt;
      zeige(0);
    } else {
      halt();
      return;
    }
  } else {
    zeige(f);
    klinge(vorher, frame);
  }
  requestAnimationFrame(takt);
}

function spiele() {
  if (frame >= letzterFrame) zeige(0);
  ctx?.resume();
  spielt = true;
  startFrame = frame;
  startZeit = performance.now();
  $('abspielen').textContent = 'Pause';
  $('abspielen').setAttribute('aria-pressed', 'true');
  $('hinweis').textContent = '';
  requestAnimationFrame(takt);
}
function halt() {
  spielt = false;
  $('abspielen').textContent = 'Abspielen';
  $('abspielen').setAttribute('aria-pressed', 'false');
}

$('abspielen').addEventListener('click', () => (spielt ? halt() : spiele()));
regler.addEventListener('input', () => {
  halt();
  zeige(Number(regler.value));
});
document.addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement && e.target.type === 'range' && e.key !== ' ') return;
  if (e.key === ' ') {
    e.preventDefault();
    spielt ? halt() : spiele();
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    halt();
    zeige(frame + (e.key === 'ArrowRight' ? 1 : -1));
  } else if (e.key === 'Home') {
    halt();
    zeige(0);
  }
});

for (const [name, [start]] of Object.entries(A.BEATS)) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = `${name} · ${start.toFixed(2)} s`;
  b.addEventListener('click', () => {
    halt();
    zeige(start * fps);
  });
  $('marken').append(b);
}

// Schnittstelle für Werkzeuge (Standbild, Video, Tests).
// Wer von außen ein Bild verlangt, hält die Wiedergabe an.
window.szene = {
  fps,
  letzterFrame,
  zeige: (f) => {
    halt();
    zeige(f);
  },
  spielt: () => spielt,
  tonZustand: () => ctx?.state ?? 'kein-ton',
};

zeige(0);
await ladeTon();
const ruhig = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (ruhig) {
  $('hinweis').textContent = 'Bewegung reduziert: Die Szene steht. „Abspielen“ startet sie.';
} else if (!ctx || ctx.state === 'running') {
  spiele();
} else {
  // Der Browser erlaubt keinen Ton ohne Klick: warten bei 0, statt stumm zu laufen.
  $('hinweis').textContent = 'Zum Abspielen mit Ton bitte „Abspielen“ drücken.';
}
document.documentElement.dataset.bereit = '1';
</script>
</body>
</html>
